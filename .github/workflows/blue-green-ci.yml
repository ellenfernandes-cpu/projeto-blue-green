name: Pipeline CI/CD - Validação Blue-Green

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Validar sintaxe dos arquivos Docker Compose e Nginx
        run: |
          docker compose config

      - name: Subir infraestrutura (Blue, Green e Router)
        run: |
          docker compose up -d

      - name: Aguardar inicialização dos contêineres Nginx
        run: sleep 5

      - name: Testar resposta HTTP do Roteador Proxy (Porta 80)
        run: |
          curl --fail http://localhost:80 || exit 1

      - name: Testar endpoint direto da versão Blue (Porta 8081)
        run: |
          curl --fail http://localhost:8081 || exit 1

      - name: Encerrar contêineres de teste
        if: always()
        run: |
          docker compose down